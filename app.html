<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>Chatbot</title>
</head>
<body>
    <div class = "sidebar">
        <button class="sideclose" onclick="OpenSide()" aria-label="Close sidebar">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <line x1="8" y1="4" x2="8" y2="20"></line>
            </svg>
        </button>
        <div  class="sidebrand"> 
            <span>✦</span>
            <div>
                <h2>Sylqora</h2>
                <p>Study Companion</p>
            </div>
        </div>
        <button class = "newchat" onclick="ClearDiscussion()"> + New Chat</button>
        <h3>Recent Chats</h3>
        <div class = "list" ></div>
    </div>
    <div class = "sidebaroverlay" onclick="OpenSide()"></div>
    <div class = "main">
     <button class="sidebarbtn" onclick="OpenSide()" aria-label="Open sidebar">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <line x1="8" y1="4" x2="8" y2="20"></line>
      </svg>
     </button>
    <div class="Chat">
        <div class = "quizstatus">
            <span class = "quiztopic"></span>
            <span class = "quizprogress"></span>
        </div>
        <div class = "explainstatus">
            <span class = "explaintopic"></span>
        </div>
        <div class = "flashcardbox">
            <div class = "flashcardcontent"></div>
            <button class = "flashcardbtn" onclick="FlashcardButton()">Reveal Answer</button>
        </div>
    <div class = "welcometxt">
        <h2>What are we learning today?</h2>
        <p>Ask a question, revise a topic, or work through a problem</p>
        <div class="suggestions">
        <div class = "suggestion" onclick="ExplainConcept()">
            <strong>✦ Explain a concept</strong>
            <span>Break down a confusing topic</span>
        </div>
        <div class="suggestion" onclick="Quizme()">
            <strong>?</strong>
            <span>Quiz me on a topic</span>
        </div>
        <div class = "suggestion" onclick="Flashcards()">
            <strong>◫ Flashcards</strong>
            <span>Review a topic one card at a time</span>
        </div>
    </div>
    </div>
    <div class="Thinking">
        <p>Sylqora is thinking...</p>
    </div>

    </div>
    <div class="input">
        <textarea type="text"   id="input"   placeholder="Ask Sylqora anything ..." ></textarea>
        <button class="sendbtn"   onclick="sendMessage()">➤</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
