<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>Chatbot</title>
</head>
<body>
    <div class = "sidebar">
        <div  class="sidebrand"> 
            <span>✦</span>
            <div>
                <h2>Sylqora</h2>
                <p>Study Companion</p>
            </div>
        </div>
        <button class = "newchat" onclick="ClearDiscussion()"> + New Chat</button>
        <h3>Recent Chats</h3>
        <div class = "list" ></div>
    </div>
    <div class = "main">
    
    <div class="Chat">
        
    <div class = "welcometxt">
        <h2>What are we learning today?</h2>
        <p>Ask a question, revise a topic, or work through a problem</p>
        <div class="suggestions">
        <div class = "suggestion" onclick="ExplainConcept()">
            <strong>✦ Explain a concept</strong>
            <span>Break down a confusing topic</span>
        </div>
        <div class="suggestion" onclick="Quizme()">
            <strong>?</strong>
            <span>Quiz me on a topic</span>
        </div>
    </div>
    </div>
    <div class="Thinking">
        <p>Sylqora is thinking...</p>
    </div>

    </div>
    <div class="input">
        <input type="text"   id="input"   placeholder="Ask Sylqora anything ..." >
        <button class="sendbtn"   onclick="sendMessage()">➤</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
